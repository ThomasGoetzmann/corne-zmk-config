name: Build ZMK firmware
on:
  # Only rebuild when something that ends up in the firmware changes
  push:
    paths: &firmware
      - config/**
      - boards/**
      - dts/**
      - src/**
      - zephyr/**
      - CMakeLists.txt
      - Kconfig
      - build.yaml
      - .github/workflows/build.yml
  pull_request:
    paths: *firmware
  workflow_dispatch:

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@4dd95d7840eb3d5a3f59bb29fbf1ab054715ef85 # main, 2026-10 (Zephyr 4.1)
