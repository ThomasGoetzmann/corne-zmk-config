# keymap-drawer config, used by .github/workflows/draw.yml
# (https://github.com/caksoylar/keymap-drawer/blob/main/CONFIGURATION.md)
parse_config:
  # Keep FR_* names unexpanded so they can be mapped to the AZERTY glyph below,
  # instead of the QWERTY HID usage they resolve to in keys_fr.h.
  preprocess: false
  zmk_keycode_map:
    # All defines from config/keys_fr.h, glyph as typed on a French AZERTY OS layout
    FR_ESCAPE_CHARACTER: "Esc"
    FR_FILE_SEPARATOR: "FS"
    FR_GROUP_SEPARATOR: "GS"
    FR_SPACE: "␣"
    FR_EXCLAMATION: "!"
    FR_EXCL: "!"
    FR_DOUBLE_QUOTES: "\""
    FR_DQT: "\""
    FR_HASH: "#"
    FR_POUND: "#"
    FR_DOLLAR: "$"
    FR_DLLR: "$"
    FR_PERCENT: "%"
    FR_PRCNT: "%"
    FR_AMPERSAND: "&"
    FR_AMPS: "&"
    FR_SINGLE_QUOTE: "'"
    FR_SQT: "'"
    FR_APOSTROPHE: "'"
    FR_APOS: "'"
    FR_LEFT_PARENTHESIS: "("
    FR_LPAR: "("
    FR_RIGHT_PARENTHESIS: ")"
    FR_RPAR: ")"
    FR_ASTERISK: "*"
    FR_ASTRK: "*"
    FR_STAR: "*"
    FR_PLUS: "+"
    FR_COMMA: ","
    FR_MINUS: "-"
    FR_PERIOD: "."
    FR_DOT: "."
    FR_SLASH: "/"
    FR_FSLH: "/"
    FR_N0: "0"
    FR_N1: "1"
    FR_N2: "2"
    FR_N3: "3"
    FR_N4: "4"
    FR_N5: "5"
    FR_N6: "6"
    FR_N7: "7"
    FR_N8: "8"
    FR_N9: "9"
    FR_COLON: ":"
    FR_SEMICOLON: ";"
    FR_SEMI: ";"
    FR_LESS_THAN: "<"
    FR_LT: "<"
    FR_EQUAL: "="
    FR_GREATER_THAN: ">"
    FR_GT: ">"
    FR_QUESTION: "?"
    FR_QMARK: "?"
    FR_AT_SIGN: "@"
    FR_AT: "@"
    FR_LEFT_BRACKET: "["
    FR_LBKT: "["
    FR_BACKSLASH: "\\"
    FR_BSLH: "\\"
    FR_RIGHT_BRACKET: "]"
    FR_RBKT: "]"
    FR_CARET: "^"
    FR_UNDERSCORE: "_"
    FR_UNDER: "_"
    FR_GRAVE: "`"
    FR_A: "A"
    FR_B: "B"
    FR_C: "C"
    FR_D: "D"
    FR_E: "E"
    FR_F: "F"
    FR_G: "G"
    FR_H: "H"
    FR_I: "I"
    FR_J: "J"
    FR_K: "K"
    FR_L: "L"
    FR_M: "M"
    FR_N: "N"
    FR_O: "O"
    FR_P: "P"
    FR_Q: "Q"
    FR_R: "R"
    FR_S: "S"
    FR_T: "T"
    FR_U: "U"
    FR_V: "V"
    FR_W: "W"
    FR_X: "X"
    FR_Y: "Y"
    FR_Z: "Z"
    FR_LEFT_BRACE: "{"
    FR_LBRC: "{"
    FR_PIPE: "|"
    FR_RIGHT_BRACE: "}"
    FR_RBRC: "}"
    FR_TILDE: "~"
    FR_POUND_SIGN: "£"
    FR_CURRENCY_SIGN: "¤"
    FR_CURREN: "¤"
    FR_SECTION: "§"
    FR_SECT: "§"
    FR_UMLAUT: "¨"
    FR_DEGREE: "°"
    FR_DEG: "°"
    FR_SUPER2: "²"
    FR_SQUARE: "²"
    FR_MU: "µ"
    FR_MICRO: "µ"
    FR_A_GRAVE: "à"
    FR_C_CEDILLA: "ç"
    FR_E_GRAVE: "è"
    FR_E_ACUTE: "é"
    FR_U_GRAVE: "ù"
    FR_EURO: "€"
    # Raw keycodes used outside FR_* (macOS French ISO: the key left of 1 types < / >)
    GRAVE: "<"
    LS(GRAVE): ">"
    BSPC: "⌫"
    DEL: "⌦"
    RET: "⏎"
    KP_ENTER: "⏎"
    TAB: "⇥"
    ESC: "Esc"
    SPACE: "␣"
    UP: "↑"
    DOWN: "↓"
    LEFT: "←"
    RIGHT: "→"
    PAGE_UP: "PgUp"
    PG_DN: "PgDn"
    HOME: "Home"
    END: "End"
    PSCRN: "PrtSc"
    C_MUTE: "Mute"
    C_VOL_UP: "Vol+"
    C_VOL_DN: "Vol-"
    LSHIFT: "Shift"
    LSHFT: "Shift"
    LEFT_SHIFT: "Shift"
    RSHIFT: "Shift"
    LCTRL: "Ctrl"
    LEFT_CONTROL: "Ctrl"
    RCTRL: "Ctrl"
    LALT: "Alt"
    LEFT_ALT: "Alt"
    LGUI: "Gui"
    GLOBE: "Globe"
  raw_binding_map:
    # Number mod-morphs: digit on AZERTY, plain QWERTY digit with Gui held (workspace switch)
    "&mm_n1": "1"
    "&mm_n2": "2"
    "&mm_n3": "3"
    "&mm_n4": "4"
    "&mm_n5": "5"
    "&mm_n6": "6"
    "&mm_n7": "7"
    "&mm_n8": "8"
    "&mm_n9": "9"
    "&macro_e_circonflex": "ê"
    "&macro_a_circonflex": "â"
    "&macro_bt_sel0": "BT 0"
    "&macro_bt_sel1": "BT 1"
    "&macro_bt_sel2": "BT 2"
    "&macro_bt_sel3": "BT 3"
    "&macro_bt_sel4": "BT 4"
    "&macro_bt_clr": "BT CLR"
    "&macro_bt_clr_all": "BT CLR ALL"
    "&macro_mac_on": "Mac ON"
    "&macro_mac_off": "Mac OFF"
    "&bat_rgb": "Batt"
    "&rgb_ug RGB_TOG": "RGB"
    "&sys_reset": "Reset"
    "&bootloader": "Boot"
    "&msc SCRL_UP": "Scroll ↑"
    "&msc SCRL_DOWN": "Scroll ↓"
    "&mmv MOVE_UP": "Mouse ↑"
    "&mmv MOVE_DOWN": "Mouse ↓"
    "&mmv MOVE_LEFT": "Mouse ←"
    "&mmv MOVE_RIGHT": "Mouse →"
    "&mkp LCLK": "Click L"
    "&mkp RCLK": "Click R"
    "&tog 8": "Sel"
  zmk_combos:
    # Adjacent-key combos are drawn inline on the base layer only,
    # the others get separate diagrams (separate_combo_diagrams below)
    combo_esc-with-gh: {draw_separate: false, l: [keys]}
    combo_left_parenthesis: {draw_separate: false, l: [keys]}
    combo_right_parenthesis: {draw_separate: false, l: [keys]}
    combo_left_bracket: {draw_separate: false, l: [keys]}
    combo_right_bracket: {draw_separate: false, l: [keys]}
    combo_left_brace: {draw_separate: false, l: [keys]}
    combo_right_brace: {draw_separate: false, l: [keys]}
    combo_less_than: {draw_separate: false, l: [keys]}
    combo_greater_than: {draw_separate: false, l: [keys]}
    combo_slash: {draw_separate: false, l: [keys]}
    combo_backslash: {draw_separate: false, l: [keys]}
    # macOS-only variants, the mac layers are not drawn
    combo_mac_less_than: {hidden: true}
    combo_mac_greater_than: {hidden: true}
draw_config:
  separate_combo_diagrams: true
